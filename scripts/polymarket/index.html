<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymarket User Data - FDC Verification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .input-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .config-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .logs-section {
            margin-top: 25px;
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logs-header h2 {
            color: #333;
        }

        .clear-btn {
            background: #dc3545;
            width: auto;
            padding: 8px 20px;
            font-size: 14px;
        }

        .logs-container {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 10px;
            padding: 8px;
            border-left: 3px solid transparent;
            border-radius: 4px;
        }

        .log-entry.info {
            border-left-color: #4a9eff;
            background: rgba(74, 158, 255, 0.1);
        }

        .log-entry.success {
            border-left-color: #4caf50;
            background: rgba(76, 175, 80, 0.1);
        }

        .log-entry.error {
            border-left-color: #f44336;
            background: rgba(244, 67, 54, 0.1);
        }

        .log-entry.warning {
            border-left-color: #ff9800;
            background: rgba(255, 152, 0, 0.1);
        }

        .log-time {
            color: #888;
            margin-right: 10px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.pending {
            background: #ff9800;
            animation: pulse 1.5s infinite;
        }

        .status-indicator.success {
            background: #4caf50;
        }

        .status-indicator.error {
            background: #f44336;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .result-section {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-item {
            margin-bottom: 15px;
            padding: 15px;
            background: white;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .result-item h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .result-item p {
            color: #666;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Polymarket User Data</h1>
            <p>FDC Verification Frontend</p>
        </div>

        <div class="content">
            <div class="input-section">
                <div class="form-group">
                    <label for="userAddress">User Address (Ethereum)</label>
                    <input 
                        type="text" 
                        id="userAddress" 
                        placeholder="0x..." 
                        value="0xb1d9476e5a5ba938b57cf0a5dc7a91a114605ee1"
                    >
                </div>

                <div class="config-group">
                    <div class="form-group">
                        <label for="verifierUrl">Verifier URL</label>
                        <input 
                            type="text" 
                            id="verifierUrl" 
                            value="https://web2json-verifier-test.flare.rocks/"
                            placeholder="Verifier API URL"
                        >
                    </div>
                    <div class="form-group">
                        <label for="apiKey">API Key</label>
                        <input 
                            type="text" 
                            id="apiKey" 
                            value="00000000-0000-0000-0000-000000000000"
                            placeholder="Verifier API Key"
                        >
                    </div>
                </div>
                <div class="form-group" style="margin-top: 15px; padding: 15px; background: #fff3cd; border-radius: 6px; border-left: 4px solid #ffc107;">
                    <strong>⚠️ Backend Server Required</strong>
                    <p style="margin: 8px 0 0 0; font-size: 14px; color: #856404;">
                        To deploy contracts and submit to blockchain, start the backend server:<br>
                        <code style="background: #f8f9fa; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 4px;">
                            cd scripts/polymarket && npm install && npm start
                        </code>
                    </p>
                </div>

                <button id="startBtn" onclick="startVerification()">Start FDC Verification</button>
            </div>

            <div class="logs-section">
                <div class="logs-header">
                    <h2>📋 Logs & Output</h2>
                    <button class="clear-btn" onclick="clearLogs()">Clear Logs</button>
                </div>
                <div id="logsContainer" class="logs-container"></div>
            </div>

            <div id="resultSection" class="result-section">
                <h2>✅ Verification Results</h2>
                <div id="results"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
